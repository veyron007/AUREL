<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="AUREL, a personal planetary intelligence console by Varun Pokhriyal">
  <defs>
    <radialGradient id="sky" cx="50%" cy="115%" r="95%">
      <stop offset="0" stop-color="#16324a"/>
      <stop offset="0.45" stop-color="#0a1422"/>
      <stop offset="1" stop-color="#040609"/>
    </radialGradient>
    <radialGradient id="planet" cx="50%" cy="0%" r="70%">
      <stop offset="0" stop-color="#7ad7ff" stop-opacity="0.55"/>
      <stop offset="0.25" stop-color="#2a6b8f" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06101a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" x2="1">
      <stop offset="0" stop-color="#f2ebdd"/>
      <stop offset="0.55" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d6ab55"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" x2="1">
      <stop offset="0" stop-color="#d6ab55" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#d6ab55"/>
      <stop offset="1" stop-color="#d6ab55" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="360" fill="url(#sky)"/>
  <g fill="#ffffff">
    <circle cx="84" cy="52" r="1.2" opacity=".7"/><circle cx="210" cy="118" r=".9" opacity=".5"/>
    <circle cx="318" cy="38" r="1.4" opacity=".8"><animate attributeName="opacity" values=".8;.2;.8" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="462" cy="96" r=".8" opacity=".5"/><circle cx="1188" cy="64" r="1.3" opacity=".8"/>
    <circle cx="1060" cy="130" r=".9" opacity=".5"><animate attributeName="opacity" values=".5;1;.5" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="40" r="1.1" opacity=".6"/><circle cx="1230" cy="190" r=".8" opacity=".4"/>
    <circle cx="140" cy="210" r=".9" opacity=".4"/><circle cx="820" cy="88" r=".7" opacity=".5"/>
  </g>
  <ellipse cx="640" cy="700" rx="900" ry="420" fill="url(#planet)"/>
  <path d="M -40 360 Q 640 205 1320 360" fill="none" stroke="#7ad7ff" stroke-opacity=".55" stroke-width="1.5"/>
  <g transform="translate(640 150)">
    <ellipse rx="300" ry="62" fill="none" stroke="#7ad7ff" stroke-opacity=".22" stroke-width="1" transform="rotate(-8)"/>
    <ellipse rx="300" ry="62" fill="none" stroke="#d6ab55" stroke-opacity=".7" stroke-width="1.4" stroke-dasharray="2 10" transform="rotate(-8)">
      <animate attributeName="stroke-dashoffset" from="0" to="-240" dur="12s" repeatCount="indefinite"/>
    </ellipse>
    <circle r="4" fill="#7ad7ff">
      <animateMotion dur="9s" repeatCount="indefinite" path="M 300 0 A 300 62 0 1 1 -300 0 A 300 62 0 1 1 300 0" rotate="0"/>
    </circle>
    <text y="22" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="92" font-weight="300" letter-spacing="34" fill="url(#word)">AUREL</text>
  </g>
  <rect x="490" y="196" width="300" height="1.5" fill="url(#seam)"/>
  <text x="640" y="232" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" letter-spacing="5" fill="#c7c1b5">ADAPTIVE UNIFIED RECONNAISSANCE &amp; EXPLORATION LENS</text>
  <text x="640" y="276" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="20" fill="#f2ebdd">Designed, engineered and maintained by <tspan font-weight="700" fill="#d6ab55">Varun Pokhriyal</tspan></text>
</svg>
