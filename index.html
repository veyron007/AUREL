<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AUREL — Your world. In perspective.</title>
  <!-- Raster fallbacks: Safari ignores an SVG apple-touch-icon and falls back to a
       screenshot of the page, so an installed app needs a real PNG. Regenerate
       these from the logo with `node scripts/generate-icons.mjs`. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
  <!-- Listed after the PNG: browsers that use the last usable icon keep the SVG
       for the tab. -->
  <link rel="icon" type="image/svg+xml" href="/aurel-favicon.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#141011" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <meta name="apple-mobile-web-app-title" content="AUREL" />
  <link rel="stylesheet" href="/style.css" />
  <!-- Local open-license type and icons; see public/fonts/manifest.json. -->
  <link rel="stylesheet" href="/fonts/fonts.css" />
</head>
<body>
  <div class="gev-view" data-gev-view="scene-chrome"></div>
  <div class="gev-view" data-gev-view="cockpit"></div>
  <div class="gev-view" data-gev-view="display-controls"></div>
  <div class="gev-view" data-gev-view="command-dock"></div>
  <div class="gev-view" data-gev-view="layer-panels"></div>
  <div class="gev-view" data-gev-view="context"></div>
  <div class="gev-view" data-gev-view="welcome"></div>
  <div class="gev-view" data-gev-view="provider-settings"></div>
  <!-- Intelligence HUD Overlay -->
  <div class="gev-view" data-gev-view="intel-hud"></div>

  <!-- Loading screen -->
  <div id="loading-screen">
    <div class="loader-content">
      <span class="loader-logo brand-logo" data-logo-gaze data-logo-src="/aurel-mark.svg" aria-hidden="true"><img src="/aurel-mark.svg" alt="" /></span>
      <h2 class="aurel-wordmark" translate="no">AUREL</h2>
      <p class="aurel-loader-tagline" data-i18n>Your world. In perspective.</p>
      <p class="loader-status" data-i18n>Initializing photorealistic world...</p>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
